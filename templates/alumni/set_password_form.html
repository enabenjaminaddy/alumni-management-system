<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password - Alumni Portal</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style for Django form fields rendered with as_p */
        .django-form p {
            margin-bottom: 1.5rem;
        }
        .django-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151; /* gray-700 */
        }
        .django-form input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #D1D5DB; /* gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .django-form input[type="password"]:focus {
            outline: none;
            border-color: #4f46e5; /* indigo-600 */
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        .django-form .helptext {
            font-size: 0.875rem;
            color: #6b7280; /* gray-500 */
            margin-top: 0.5rem;
        }
        .django-form ul.errorlist {
            list-style-type: none;
            padding: 0;
            margin: -0.5rem 0 1rem 0;
            color: #ef4444; /* red-500 */
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Create Your Password</h1>
            <p class="text-gray-500">Welcome! Set a secure password to activate your alumni account.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="django-form">
                <!-- 
                  Django's SetPasswordForm will render two fields:
                  - New password
                  - New password confirmation
                  `form.as_p` will handle them both.
                -->
                {{ form.as_p }}
            </div>

            <!-- Submit Button -->
            <div class="mt-8">
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Set Password and Login
                </button>
            </div>
        </form>
    </div>

</body>
</html>
