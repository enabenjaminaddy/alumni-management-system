<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Henry Djaba Memorial Foundation</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% include 'alumni/base_styles.html' %}
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .foundation-gradient {
            background: linear-gradient(135deg, var(--org-secondary) 0%, var(--org-primary) 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-purple-100 text-center">
        <!-- Foundation Header -->
        <div class="mb-6">
            <h3 class="text-lg font-bold text-org-secondary">Henry Djaba Memorial Foundation</h3>
            <div class="w-16 h-1 bg-gradient-to-r from-org-secondary to-org-primary mx-auto rounded mt-2"></div>
        </div>

        <!-- Icon -->
        <div
            class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-purple-100 to-blue-100 mb-6">
            <svg class="w-6 h-6 text-org-secondary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
            </svg>
        </div>
        
        <!-- Message -->
        <h1 class="text-2xl font-bold text-gray-900">You have been successfully logged out.</h1>
        <p class="text-gray-500 mt-2">Thank you for visiting the Henry Djaba Memorial Foundation Alumni Portal.</p>

        <!-- Back to Login Button -->
        <div class="mt-8">
            <a href="{% url 'login' %}"
                class="w-full inline-block foundation-gradient text-white font-semibold py-3 px-4 rounded-md hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-org-secondary transition-all no-underline shadow-lg">
                Login Again
            </a>
        </div>
    </div>

</body>
</html>
