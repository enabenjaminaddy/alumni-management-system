{% extends 'alumni/base_auth.html' %}

{% block title %}Logged Out - Alumni Management System{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white border border-gray-200 rounded-lg p-8 text-center">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 mb-6">
                <svg class="w-6 h-6 text-org-secondary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">You’ve been logged out</h1>
            <p class="text-gray-600 mt-2">Thanks for visiting the Alumni Management System.</p>
            <div class="mt-8">
                <a href="{% url 'login' %}" class="btn-primary w-full">Login again</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
