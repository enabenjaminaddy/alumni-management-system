<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; 
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .app-header {
            flex-shrink: 0; 
        }
        /* This is the main change: make the content area a flex container to center its child */
        .app-content {
            flex-grow: 1;
            overflow: auto; /* Allow scrolling if content is too big */
            padding: 2rem; /* Add some padding around the embedded app */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .budibase-container {
            width: 100%;
            height: 100%;
            max-width: 1400px; /* Optional: Set a max-width for very large screens */
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            overflow: hidden; /* Hide anything that spills out of the rounded corners */
        }
        .budibase-iframe {
            width: 100%;
            height: 100%;
            border: none; 
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header bg-white shadow-sm z-10">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <h1 class="text-xl font-bold text-indigo-600">Alumni Admin</h1>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-500 hover:text-gray-900 rounded-md px-3 py-2 text-sm font-medium transition-colors">
                           &larr; Back to Home
                        </a>
                        <a href="/logout/" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition-colors no-underline text-sm">
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area - now centers its content -->
        <main class="app-content">
            <div class="budibase-container">
                <!-- 
                  **IMPORTANT**
                  Replace the `src` attribute below with the public URL 
                  of your self-hosted Budibase application.
                -->
                <iframe width="1400" height="900" frameborder="0" allow="clipboard-write;camera;geolocation;fullscreen" src="http://3.232.163.161:10000/embed/annoying-ngo"></iframe>
            </div>
        </main>
    </div>

</body>
</html>
