{% extends 'alumni/base_auth.html' %}

{% block title %}Password Reset Complete - Alumni Management System{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <div class="bg-white border border-gray-200 rounded-lg p-8 text-center">
            <div class="mx-auto h-14 w-14 bg-green-100 rounded-full flex items-center justify-center mb-6">
                <svg class="h-7 w-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-3">Password reset complete</h1>
            <p class="text-gray-600">
                Your password has been updated. You can now log in with your new password.
            </p>
            <div class="mt-8">
                <a href="{% url 'login' %}" class="btn-primary w-full">Continue to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
